name: Deploy Backend to Azure Container Apps

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "chroma_db/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/backend-deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy backend
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          acrName: mjiaiknowledgeacr
          imageToBuild: mjiaiknowledgeacr.azurecr.io/ai-knowledge-assistant:${{ github.sha }}
          containerAppName: ai-knowledge-assistant-api
          resourceGroup: rg-ai-knowledge-assistant